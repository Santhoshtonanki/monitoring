groups:
  - name: network-utilization-alerts
    rules:

      - alert: HighNetworkReceive
        expr: rate(node_network_receive_bytes_total{device!~"lo"}[5m]) > 100 * 1024 * 1024
        for: 5m
        labels:
          severity: critical
          team: monitoring
        annotations:
          summary: "High network receive traffic on {{ $labels.instance }}"
          description: "Network receive traffic is above 100 MB/s on {{ $labels.instance }} interface {{ $labels.device }}"

      - alert: HighNetworkTransmit
        expr: rate(node_network_transmit_bytes_total{device!~"lo"}[5m]) > 100 * 1024 * 1024
        for: 5m
        labels:
          severity: critical
          team: monitoring
        annotations:
          summary: "High network transmit traffic on {{ $labels.instance }}"
          description: "Network transmit traffic is above 100 MB/s on {{ $labels.instance }} interface {{ $labels.device }}"