groups:
  - name: ram-utilization-alerts
    rules:

      - alert: LowRAMUtilization
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 < 10
        for: 5m
        labels:
          severity: warning
          team: monitoring
        annotations:
          summary: "Low RAM utilization on {{ $labels.instance }}"
          description: "RAM utilization is below 10% on {{ $labels.instance }}"

      - alert: HighRAMUtilization
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 75
        for: 5m
        labels:
          severity: critical
          team: monitoring
        annotations:
          summary: "High RAM utilization on {{ $labels.instance }}"
          description: "RAM utilization is above 75% on {{ $labels.instance }}"